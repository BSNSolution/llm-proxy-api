# Render Blueprint — LLM Proxy API
# https://render.com/docs/blueprint-spec
#
# Sobe: web service (a partir do Dockerfile) + Postgres + Key Value (Redis)
# gerenciados pela Render. HTTPS e domínio .onrender.com automáticos.
#
# Uso: no Render → New → Blueprint → aponte para este repo (ele detecta este
# arquivo). Depois do 1º deploy, defina PUBLIC_BASE_URL com a URL final e
# configure uma fonte HTTP (API key) no painel do app (Fontes & Combos).

databases:
  - name: llmproxy-db
    databaseName: llmproxy
    user: llmproxy
    plan: free # troque conforme a necessidade

services:
  - type: keyvalue # Redis gerenciado
    name: llmproxy-redis
    plan: free
    ipAllowList: [] # só acessível pela rede interna da Render

  - type: web
    name: llmproxy
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter # o proxy roda sempre-on; free hiberna
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: API_PORT
        value: '8787'
      - key: PORT # a Render injeta PORT; espelhamos p/ o app
        value: '8787'
      - key: DATABASE_URL
        fromDatabase:
          name: llmproxy-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: llmproxy-redis
          type: keyvalue
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true # a Render gera um segredo forte
      - key: PUBLIC_BASE_URL
        sync: false # defina com a URL final (…onrender.com ou domínio custom)
      # Opcional: criar admin automaticamente (senão, cria no 1º acesso)
      # - key: ADMIN_EMAIL
      #   sync: false
      # - key: ADMIN_PASSWORD
      #   sync: false
