name: CI

# ⏸️ 27/09/2026: gatilhos automáticos PAUSADOS — cota Free do GitHub Actions da org esgotou.
# Padrão agora: `ci:local` antes do push (ver AI/NOTES). Para reativar, troque o bloco `on:` pelo original abaixo.
on:
  workflow_dispatch:
# --- gatilhos originais ---
# on:
#   push:
#     branches: [main]
#   pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @llm-proxy/db exec prisma generate

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build (strict)
        run: pnpm build
