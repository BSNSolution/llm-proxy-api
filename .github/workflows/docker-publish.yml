name: docker-publish

# Builda e publica a imagem no GitHub Container Registry (GHCR) a cada push na main
# e em tags v*. A imagem NÃO inclui as LLM CLIs (elas rodam no host ou via HTTP
# provider); veja o README (modo híbrido).

# ⏸️ 27/09/2026: gatilhos automáticos PAUSADOS — cota Free do GitHub Actions da org esgotou.
# Padrão agora: `ci:local` antes do push (ver AI/NOTES). Para reativar, troque o bloco `on:` pelo original abaixo.
on:
  workflow_dispatch:
# --- gatilhos originais ---
# on:
#   push:
#     branches: [main]
#     tags: ['v*']
#   workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
