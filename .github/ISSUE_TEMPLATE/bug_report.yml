name: Bug report
description: Report a problem with LLM Proxy API
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: e.g. v0.1.0 or commit sha
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, Docker]
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: e.g. 22.x
  - type: input
    id: cli
    attributes:
      label: Which LLM CLI(s)?
      placeholder: e.g. Claude Code 2.1.x, Codex 0.14.x
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste any error output (redact secrets/keys!).
      render: shell
