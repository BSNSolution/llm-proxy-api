packages:
  - "apps/*"
  - "packages/*"

# Força versões corrigidas de transitivas vulneráveis (advisories high em PROD via Fastify).
overrides:
  fast-uri: "^4.1.1"
  find-my-way: "^9.7.0"
  # advisories high PROD (jul/2026): brace-expansion DoS (patch seguro);
  # @fastify/static path-traversal — servimos o SPA com ele, então subir p/ 9.1.1+.
  # react-router 7→8 (CSRF RSC) NÃO aplicado: usamos SPA client-side (RSC não é
  # usado) e o major traria breaking changes — fica como task de baixo risco.
  brace-expansion: "^5.0.8"
  "@fastify/static": "^10.1.1"

# pnpm 11 bloqueia build scripts de deps por padrão; em CI (não-interativo) isso
# aborta o install com ERR_PNPM_IGNORED_BUILDS. `allowBuilds` (substituto de
# `onlyBuiltDependencies` a partir do v11) aprova só o necessário p/ os postinstall.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
