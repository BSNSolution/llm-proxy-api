# =====================================================================
# LLM Proxy API — compose para DOKPLOY (cloud.bsnsolution.com.br)
# Domínio: https://llm.bsnsolution.com.br  (wildcard *.bsnsolution.com.br já na CF)
#
# ⚠️ dokploy-network é COMPARTILHADA entre projetos → nomes de serviço ÚNICOS
#    (prefixo llmp-). Nunca "postgres"/"redis"/"app" genéricos (colidem).
# ⚠️ Modo de execução: num container NÃO há CLIs locais (claude/codex/…). O
#    painel/login/gestão sobem normalmente; para o PROXY responder, configure
#    uma FONTE HTTP (API key Anthropic/OpenAI/Gemini) em "Fontes & Combos".
# =====================================================================

services:
  llmp-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: llm-proxy-api:dokploy
    restart: unless-stopped
    depends_on:
      llmp-postgres:
        condition: service_healthy
      llmp-redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 8787
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://${POSTGRES_USER:-llmproxy}:${POSTGRES_PASSWORD:-llmproxy}@llmp-postgres:5432/${POSTGRES_DB:-llmproxy}?schema=public
      REDIS_URL: redis://llmp-redis:6379
      DATA_DIR: /data
      IMAGES_DIR: /data/images
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-https://llm.bsnsolution.com.br}
      # Persistido em /data se vazio; sobrescreva p/ fixar entre rebuilds.
      SESSION_SECRET: ${SESSION_SECRET:-}
      # Admin do 1º acesso: se vazios, cria pela tela de setup na 1ª visita.
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    volumes:
      - llmp-data:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:8787/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    labels:
      - traefik.enable=true
      - traefik.docker.network=dokploy-network
      # HTTP → redirect p/ HTTPS
      - traefik.http.routers.llmp-web.rule=Host(`llm.bsnsolution.com.br`)
      - traefik.http.routers.llmp-web.entrypoints=web
      - traefik.http.routers.llmp-web.middlewares=redirect-to-https@file
      # HTTPS + letsencrypt
      - traefik.http.routers.llmp-websecure.rule=Host(`llm.bsnsolution.com.br`)
      - traefik.http.routers.llmp-websecure.entrypoints=websecure
      - traefik.http.routers.llmp-websecure.tls.certresolver=letsencrypt
      - traefik.http.services.llmp-app.loadbalancer.server.port=8787

  llmp-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-llmproxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-llmproxy}
      POSTGRES_DB: ${POSTGRES_DB:-llmproxy}
    volumes:
      - llmp-pgdata:/var/lib/postgresql/data
    networks:
      - dokploy-network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-llmproxy}']
      interval: 5s
      timeout: 5s
      retries: 5

  llmp-redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - llmp-redisdata:/data
    networks:
      - dokploy-network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  llmp-data:
  llmp-pgdata:
  llmp-redisdata:

networks:
  dokploy-network:
    external: true
