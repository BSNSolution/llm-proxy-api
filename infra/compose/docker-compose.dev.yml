services:
  postgres:
    image: postgres:17-alpine
    container_name: llm-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: llmproxy
      POSTGRES_DB: llmproxy
    ports:
      - '5437:5432'
    volumes:
      - llm-proxy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U llmproxy']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm-proxy-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - llm-proxy-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  llm-proxy-pgdata:
  llm-proxy-redisdata:
