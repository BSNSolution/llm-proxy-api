# LLM Proxy API — stack de produção (app + Postgres + Redis).
#
# As IMAGENS GERADAS são gravadas em /data/images dentro do container, montado
# no volume nomeado `llm-proxy-images` → sobrevivem a `docker compose build` e
# rebuilds do serviço `app` (o volume não é recriado no rebuild).
#
# ⚠️ O app spawna as LLM CLIs locais (claude/codex/…). Para o proxy/chat
# funcionarem no container, monte os diretórios de credencial das CLIs como
# volumes (ex.: ~/.codex, ~/.claude.json, ~/.gemini) e garanta os binários no
# PATH da imagem — ou rode o app direto na máquina (o volume de imagens abaixo
# vira um bind para uma pasta local).

services:
  app:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: llm-proxy-api:local
    container_name: llm-proxy-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      API_PORT: 8787
      API_HOST: 0.0.0.0
      DATABASE_URL: postgresql://llmproxy:llmproxy@postgres:5432/llmproxy?schema=public
      REDIS_URL: redis://redis:6379
      # Imagens geradas → volume persistente (não some no rebuild).
      IMAGES_DIR: /data/images
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-prod}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8787}
    ports:
      - '8787:8787'
    volumes:
      - llm-proxy-images:/data/images
    healthcheck:
      test: ['CMD-SHELL', 'node -e "fetch(''http://127.0.0.1:8787/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  postgres:
    image: postgres:17-alpine
    container_name: llm-proxy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: llmproxy
      POSTGRES_PASSWORD: llmproxy
      POSTGRES_DB: llmproxy
    volumes:
      - llm-proxy-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U llmproxy']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: llm-proxy-redis
    restart: unless-stopped
    volumes:
      - llm-proxy-redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  llm-proxy-images: # imagens geradas — PERSISTE em rebuild
  llm-proxy-pgdata:
  llm-proxy-redisdata:
